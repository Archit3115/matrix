name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Matrix stays small on purpose: Python standard library only, one offline
        `graph.html`, nothing leaves the machine. Ideas that fit inside those limits
        are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Matrix do? Commands, output or UI you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get there, including what already works.
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This needs no third-party dependency and no network access.
        - label: I would like to send a pull request for this.
