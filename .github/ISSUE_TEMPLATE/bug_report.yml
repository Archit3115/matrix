name: Bug report
description: Something in Matrix does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do **not** report security
        problems here: see SECURITY.md for private reporting.
        Remove secrets, personal data and private paths from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest folder and commands that show the problem.
      placeholder: |
        1. python matrix/setup.py ~/demo --no-launcher
        2. python ~/demo/.claude/matrix/query.py find "orders"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Indexer / graph.json
        - query.py / search
        - graph.html (universe page)
        - Multiverse engine (serve.py)
        - setup.py / launcher
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04 ...
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version (for graph.html problems)
      placeholder: Chrome 140, Firefox 135, Safari 18 ...
  - type: textarea
    id: logs
    attributes:
      label: Output, errors or screenshots
      description: Terminal output, the page's console errors, or a screenshot.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets, personal data and private paths from this report.
          required: true
